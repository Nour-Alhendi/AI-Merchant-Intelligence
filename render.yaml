services:
  - type: web
    name: ai-merchant-intelligence-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
